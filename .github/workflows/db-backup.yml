# Nightly copy of the Supabase database to SharePoint.
# Runs every night (about 3:20am Pacific; GitHub can start scheduled runs a few minutes late) and on demand:
#   GitHub > freezer-map > Actions > Nightly database backup > Run workflow.
# GitHub emails whoever last edited this file if a run fails.
#
# Needs in GitHub > freezer-map > Settings > Secrets and variables > Actions:
#   Secrets:   SUPABASE_DB_PASSWORD (password of the read-only backup_reader login, see supabase/backup_reader.sql),
#              MS_TENANT_ID, MS_CLIENT_ID, MS_CLIENT_SECRET
#   Variables: SUPABASE_DB_HOST (Session pooler host, e.g. aws-0-us-west-1.pooler.supabase.com),
#              SUPABASE_DB_USER (optional, default backup_reader.gxxxhaozizjctywayhau),
#              SP_SITE (SharePoint site link), SP_FOLDER (optional, default "Database Backups")
#
# Restore: pg_restore -d <connection string> --no-owner --no-privileges lifted-db_<date>.dump
# (or ask Claude to walk through it).

name: Nightly database backup

on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_MAJOR: '17'
      PGHOST: ${{ vars.SUPABASE_DB_HOST }}
      PGPORT: '5432'
      PGUSER: ${{ vars.SUPABASE_DB_USER || 'backup_reader.gxxxhaozizjctywayhau' }}
      PGDATABASE: postgres
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGSSLMODE: require
    steps:
      - uses: actions/checkout@v4

      - name: Install Postgres tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-$PG_MAJOR > /dev/null
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"

      - name: Dump the database
        run: |
          set -uo pipefail
          # Drop any spaces or line breaks that came along with a pasted password
          export PGPASSWORD="$(printf '%s' "$PGPASSWORD" | tr -d '[:space:]')"
          echo "Signing in as $PGUSER to $PGHOST (password: ${#PGPASSWORD} characters)"
          if [ -z "$PGHOST" ] || [ -z "$PGPASSWORD" ]; then echo "::error::Set SUPABASE_DB_HOST (variable) and SUPABASE_DB_PASSWORD (secret)"; exit 1; fi
          SERVER=$(psql -tAc 'show server_version') || { echo "::error::Couldn't connect to Supabase. Check SUPABASE_DB_HOST and SUPABASE_DB_PASSWORD"; exit 1; }
          echo "pg_dump $(pg_dump --version | awk '{print $3}'), server $SERVER"
          FILE="lifted-db_$(TZ=America/Los_Angeles date +%Y-%m-%d_%H%M).dump"
          # App tables + logins (auth) + file list (storage), as far as the backup login can read them.
          # The files themselves are copied by the compliance backup.
          SCHEMAS="-n public"; SKIPPED=""
          [ "$(psql -tAc "select case when has_schema_privilege('auth','usage') then has_table_privilege('auth.users','select') else false end")" = "t" ] && SCHEMAS="$SCHEMAS -n auth" || SKIPPED="logins (auth)"
          [ "$(psql -tAc "select case when has_schema_privilege('storage','usage') then has_table_privilege('storage.objects','select') else false end")" = "t" ] && SCHEMAS="$SCHEMAS -n storage" || SKIPPED="$SKIPPED file list (storage)"
          [ -n "$SKIPPED" ] && echo "::warning::Backup login can't read: $SKIPPED. App tables are still backed up."
          pg_dump -Fc -Z 6 $SCHEMAS -f "$FILE" || { echo "::error::pg_dump failed"; exit 1; }
          # Check the file reads back and has the main tables in it
          pg_restore --list "$FILE" > contents.txt || { echo "::error::Dump file doesn't read back"; exit 1; }
          TABLES=$(grep -c ' TABLE DATA ' contents.txt || true)
          for t in pallets strains customers orders events; do
            grep -q " TABLE DATA public $t " contents.txt || { echo "::error::Table $t missing from the dump"; exit 1; }
          done
          SIZE=$(du -h "$FILE" | cut -f1)
          echo "Dump OK: $FILE, $SIZE, $TABLES tables with data"
          { echo "### Database backup"; echo "**File:** $FILE ($SIZE, $TABLES tables)"; } >> "$GITHUB_STEP_SUMMARY"
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - name: Upload to SharePoint
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          SP_SITE: ${{ vars.SP_SITE }}
          SP_FOLDER: ${{ vars.SP_FOLDER }}
        run: node tools/db_backup.mjs "$FILE"
